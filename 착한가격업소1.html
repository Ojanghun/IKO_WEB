<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>착한가격업소</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #cae0f3;
    }

    /* 상단 헤더 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      
    }

    .logo {
      font-weight: bold;
      font-size: 18px;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-left button,
    .nav-right button {
      padding: 6px 12px;
      border-radius: 5px;
      border: 1px solid #ccc;
      cursor: pointer;
      font-size: 14px;
    }

    .highlight-btn {
      background-color: #fdebd0;
      border-color: #f5cba7;
    }

    /* 검색창 */
    .search-bar {
      display: flex;
      justify-content: center;
      padding: 20px 0 10px;
    }

    .search-bar input {
      width: 400px;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #aaa;
      border-radius: 10px 0 0 10px;
      outline: none;
    }

    .search-bar button {
      padding: 10px 20px;
      font-size: 14px;
      border: 1px solid #aaa;
      background-color: #f3f3f3;
      border-left: none;
      border-radius: 0 10px 10px 0;
      cursor: pointer;
    }

    /* 캐릭터 이미지 영역 */
    .characters {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding-bottom: 20px;
    }

    .characters img { 
      height: 500px; 
      object-fit: cover; 
    }

    /* 카테고리 버튼 */
    .categories {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-bottom: 20px;
      padding-top: 20px;
    }

    .categories button {
      padding: 8px 16px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .categories button:nth-child(1) { background-color: #fdd; }
    .categories button:nth-child(2) { background-color: #fcb; }
    .categories button:nth-child(3) { background-color: #ffe5a5; }
    .categories button:nth-child(4) { background-color: #ddf5dd; }
    .categories button:nth-child(5) { background-color: #c9eaf0; }
    .categories button:nth-child(6) { background-color: #d0e2f2; }
    .categories button:nth-child(7) { background-color: #f2d0d0; }
    .categories button:nth-child(8) { background-color: #ecc8d9; }

    /* 음식 리스트 */
    .food-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      gap: 20px;
      padding: 0 20px 40px;
    }

    .food-card {
      width: 550px;
      height: 200px;
      background-color: #ffd9d9;
      border-radius: 10px;
      padding: 10px;
      display: flex; 
      justify-content: space-between;
    }

    .food-img-box {
      flex: 7;
      display: flex; 
      background: #c9eaf0; 
      width: 350px;
    }

    .food-img-file{
      width: 100%;
      height: 100%;
    }

    .food-detail{
      padding: 10px;
      align-items:center;
      flex: 3;

    }

    .food-card:nth-child(3n+2) {
      background-color: #ffe4b2;
    }

    .food-card:nth-child(3n+3) {
      background-color: #fff1b3;
    }

    .food-card h4 {
      margin: 0;
      font-size: 16px;
    }

    .food-card p {
      font-size: 13px;
      margin: 3px 0;
    }
  </style>
</head>
<body>
  

  <div class="main_page_upper" style="height: 100%;">
      
    <header>
      <div class="nav-left">
        <div class="logo">IKO</div>
        <button>착한가격업소</button>
      </div>
      <div class="nav-right">
        <button class="highlight-btn">착한가격업소란?</button>
        <button>로그인</button>
        <button>회원가입</button>
      </div>
    </header>


    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="검색창" />
      <button onclick="handleSearch()">🔍</button>
      <button style="margin-left:10px; background-color:#e7f6e7;" onclick="handleLocation()">지역 선택</button>
      <button style="background-color:#dff2e0;" onclick="handleMap()">지도</button>
    </div>
    
    <script>
      function handleSearch() {
        const query = document.getElementById('searchInput').value;
        alert("검색:" + query);
      }
    
      function handleLocation() {
        alert("지역 선택");
      }
    
      function handleMap() {

      }
    </script>
    
  
    <div class="characters">

  </div>

  

  <div class="main_page_contents" style="background-color: white; height: 70vh;">
      <div class="categories">

      <div class="food-list">

          <div class="food-detail">

            <p class="storeName" style="font-size:17px;">가게이름</p>

        <div class="food-card" data-category="분식">

            <p class="storeName" style="font-size:17px;">가게이름</p>
            <p class="storeName" style="font-size:17px;">위치</p>
            <p class="storeName" style="font-size:17px;">인기메뉴</p>

        <div class="food-card" data-category="양식">
          <div class="food-img-box">

          </div>
          
          <div class="food-detail">
            <h4 style="font-size:20px;">음식 사진</h4>
            <p class="storeName" style="font-size:17px;">가게이름</p>
            <p class="storeName" style="font-size:17px;">위치</p>
            <p class="storeName" style="font-size:17px;">인기메뉴</p>
          </div>
        </div>  
      </div>
  
      <div class="food-list">

        <div class="food-card" data-category="일식">
          <div class="food-img-box">
           <img class="food-img-file" src="./img/우동.jpg" />
          </div>
          <div class="food-detail">
            <h4 style="font-size:20px;">음식 사진</h4>
            <p class="storeName" style="font-size:17px;">가게이름</p>
            <p class="storeName" style="font-size:17px;">위치</p>
            <p class="storeName" style="font-size:17px;">인기메뉴</p>
          </div>
        </div>

        <div class="food-card" data-category="양식">
          <div class="food-img-box">
           <img class="food-img-file" src="./img/돈까스.jpg" />
          </div>
          <div class="food-detail">
            <h4 style="font-size:20px;">음식 사진</h4>
            <p class="storeName" style="font-size:17px;">가게이름</p>
            <p class="storeName" style="font-size:17px;">위치</p>
            <p class="storeName" style="font-size:17px;">인기메뉴</p>
          </div>
        </div>

        <div class="food-card" data-category="중식">
          <div class="food-img-box">
            <img class="food-img-file" src="./img/탕수육.jpg"/>
          </div>
          <div class="food-detail">
            <h4 style="font-size:20px;">음식 사진</h4>
            <p class="storeName" style="font-size:17px;">가게이름</p>

            <p class="storeName" style="font-size:17px;">인기메뉴</p>
          </div>
        </div>
    
  </div>

</body>
</html>

<script>
  const buttons = document.querySelectorAll(".categories button");
  const cards = document.querySelectorAll(".food-card");

  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      const category = btn.innerText;

      cards.forEach(card => {
        if (category === "전체" || card.dataset.category === category) {
          card.style.display = "flex";
        } else {
          card.style.display = "none";
        }
      });
    });
  });
</script>
